<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout Figma</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="topo">
        <div class="logo">Logo</div>

        <nav class="menu-esquerda">
            <a href="#">Produtos</a>
            <a href="#">Soluções</a>
            <a href="#">Comunidade</a>
            <a href="#">Recursos</a>
            <a href="#">Preços</a>
        </nav>

        <nav class="menu-direita">
            <a href="#">Entrar</a>
            <button class="btn-claro">Fale com a equipe de vendas</button>
            <button class="btn-escuro">Comece sem custos</button>
        </nav>
    </header>

    <main class="principal">

        <section class="esquerda">
            <h1>Figma Design</h1>

            <p>
                Texto genérico para representar o conteúdo principal
                e manter a estrutura visual semelhante ao layout proposto.
            </p>

            <div class="botoes">
                <button class="btn-preto">Comece agora</button>
                <button class="btn-branco">Fale com a equipe de vendas</button>
            </div>
        </section>

        <section class="direita">
            <div class="circulo"></div>
            <div class="separador"></div>
            <div class="losango"></div>
            <div class="separador"></div>
            <div class="flor"></div>
        </section>

    </main>

</body>
</html>
