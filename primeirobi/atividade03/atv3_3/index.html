<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout GitHub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="topo">
        <div class="logo">GitHub</div>

        <nav class="menu-esquerda">
            <a href="#">Plataforma</a>
            <a href="#">Soluções</a>
            <a href="#">Recursos</a>
            <a href="#">Código aberto</a>
            <a href="#">Enterprise</a>
            <a href="#">Preços</a>
        </nav>

        <nav class="menu-direita">
            <div class="pesquisa">🔍</div>
            <a href="#">Entrar</a>
            <button>Criar uma conta</button>
        </nav>
    </header>

    <main class="principal">

        <section class="conteudo">
            <h1>
                O futuro do desenvolvimento de software
                acontece em conjunto
            </h1>

            <p>
                Texto genérico para representar o conteúdo principal
                e manter a estrutura semelhante ao layout original.
            </p>

            <div class="acoes">
                <input type="text" placeholder="Digite seu e-mail">

                <button class="btn-verde">
                    Cadastrar-se no GitHub
                </button>

                <button class="btn-borda">
                    Experimente o GitHub Copilot Free
                </button>
            </div>
        </section>

    </main>

</body>
</html>
